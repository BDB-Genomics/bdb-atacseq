# =============================================================================
# Build & Publish Custom Containers to GHCR
# =============================================================================
# Builds custom Docker images used by the pipeline and pushes them to
# GitHub Container Registry (ghcr.io/bdb-genomics/bdb-atacseq).
#
# Triggers:
#   - Push to main that changes anything under containers/
#   - Manual dispatch for ad-hoc rebuilds
# =============================================================================
name: Build Custom Containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bdb-genomics/bdb-atacseq

permissions:
  contents: read
  packages: write

jobs:
  build-chromvar:
    name: Build chromVAR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/chromvar
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chromvar:1.28.0
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/chromvar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=chromvar
            org.opencontainers.image.description=chromVAR + motifmatchr for ATAC-seq
            org.opencontainers.image.source=https://github.com/BDB-Genomics/bdb-atacseq
